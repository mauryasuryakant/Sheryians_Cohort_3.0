<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NOVA_AI — Today AI Aligns With Bold Dreams</title>

  <!-- Google Fonts: Inter (400, 500, 600, 700) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['Inter', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel Standalone (for in-browser JSX parsing) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      background-color: #0a0a0a;
      color: #ffffff;
      font-family: 'Inter', system-ui, sans-serif;
    }
    ::selection {
      background: rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body class="bg-[#0a0a0a] font-sans text-white antialiased selection:bg-white/20">

  <div id="root"></div>

  <script type="text/babel">
    const { useEffect, useRef, useState } = React;

    // --- ASSETS & CONSTANTS ---
    const VIDEO_URL = "https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260729_102822_0e6c87e8-c141-4744-bf32-ad30db296371.mp4";
    const PORTRAIT_URL = "https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260728_050334_5b076e26-0ce7-4898-b432-d764190e448f.png&w=1280&q=85";
    const POSTER_URL = "/hero-poster.jpg";

    // --- ICON HELPER COMPONENTS ---
    const HexagonIcon = ({ size = 24, strokeWidth = 1.5, className = "" }) => (
      <svg
        width={size}
        height={size}
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        strokeWidth={strokeWidth}
        strokeLinecap="round"
        strokeLinejoin="round"
        className={className}
      >
        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z" />
      </svg>
    );

    const ChevronRightIcon = ({ size = 14, className = "" }) => (
      <svg
        width={size}
        height={size}
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        strokeWidth="2"
        strokeLinecap="round"
        strokeLinejoin="round"
        className={className}
      >
        <path d="m9 18 6-6-6-6" />
      </svg>
    );

    // --- REVEAL ANIMATION WRAPPER ---
    const Reveal = ({ children, delay = 0, className = "" }) => {
      const ref = useRef(null);
      const [isVisible, setIsVisible] = useState(false);

      useEffect(() => {
        const observer = new IntersectionObserver(
          ([entry]) => {
            if (entry.isIntersecting) {
              setIsVisible(true);
            }
          },
          { threshold: 0.15 }
        );

        if (ref.current) {
          observer.observe(ref.current);
        }

        return () => observer.disconnect();
      }, []);

      return (
        <div
          ref={ref}
          style={{ transitionDelay: `${delay}ms` }}
          className={`transition-all duration-700 ease-out will-change-transform ${
            isVisible ? "translate-y-0 opacity-100" : "translate-y-8 opacity-0"
          } ${className}`}
        >
          {children}
        </div>
      );
    };

    // --- SCROLL-SCRUBBED VIDEO BACKGROUND ---
    const ScrollVideo = () => {
      const videoRef = useRef(null);
      const canvasRef = useRef(null);
      const [videoLoaded, setVideoLoaded] = useState(false);
      const [framesReady, setFramesReady] = useState(false);

      const frameCache = useRef([]);
      const targetProgress = useRef(0);
      const smoothedProgress = useRef(0);
      const animFrameId = useRef(null);

      // Scroll listener
      useEffect(() => {
        const handleScroll = () => {
          const scrollY = window.scrollY;
          const scrollHeight = document.documentElement.scrollHeight;
          const innerHeight = window.innerHeight;
          const maxScroll = Math.max(1, scrollHeight - innerHeight);
          targetProgress.current = Math.min(1, Math.max(0, scrollY / maxScroll));
        };

        window.addEventListener('scroll', handleScroll, { passive: true });
        handleScroll();
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      // Offscreen frame extraction logic
      useEffect(() => {
        const videoEl = videoRef.current;
        if (!videoEl) return;

        let isCancelled = false;

        const handleLoadedData = () => {
          setVideoLoaded(true);

          const timer = setTimeout(async () => {
            if (isCancelled) return;
            const duration = videoEl.duration || 3;
            const frameCount = Math.min(90, Math.max(24, Math.floor(duration * 12)));

            const offscreenVideo = document.createElement('video');
            offscreenVideo.src = VIDEO_URL;
            offscreenVideo.muted = true;
            offscreenVideo.playsInline = true;
            offscreenVideo.preload = 'auto';

            await new Promise((res) => {
              offscreenVideo.onloadedmetadata = res;
            });

            const tempCanvas = document.createElement('canvas');
            const aspect = offscreenVideo.videoWidth / offscreenVideo.videoHeight || 16/9;
            const targetWidth = Math.min(960, offscreenVideo.videoWidth || 960);
            const targetHeight = Math.round(targetWidth / aspect);
            tempCanvas.width = targetWidth;
            tempCanvas.height = targetHeight;
            const ctx = tempCanvas.getContext('2d');

            const extracted = [];

            for (let i = 0; i < frameCount; i++) {
              if (isCancelled) return;
              const time = (i / (frameCount - 1)) * (duration - 0.05);
              offscreenVideo.currentTime = time;
              await new Promise((res) => {
                offscreenVideo.onseeked = res;
              });

              if (ctx) {
                ctx.drawImage(offscreenVideo, 0, 0, targetWidth, targetHeight);
                try {
                  const bmp = await createImageBitmap(tempCanvas);
                  extracted.push(bmp);
                } catch (e) {
                  // Fallback if createImageBitmap is unsupported
                }
              }
            }

            if (!isCancelled && extracted.length > 0) {
              frameCache.current = extracted;
              setFramesReady(true);
            }
          }, 300);

          return () => clearTimeout(timer);
        };

        if (videoEl.readyState >= 2) {
          handleLoadedData();
        } else {
          videoEl.addEventListener('loadeddata', handleLoadedData);
        }

        return () => {
          isCancelled = true;
          videoEl.removeEventListener('loadeddata', handleLoadedData);
        };
      }, []);

      // Render / Lerp Loop
      useEffect(() => {
        const canvas = canvasRef.current;
        const video = videoRef.current;
        if (!canvas) return;

        const ctx = canvas.getContext('2d');

        const render = () => {
          smoothedProgress.current += (targetProgress.current - smoothedProgress.current) * 0.12;
          const progress = smoothedProgress.current;

          const width = window.innerWidth;
          const height = window.innerHeight;
          const dpr = Math.min(window.devicePixelRatio || 1, 2);

          if (canvas.width !== width * dpr || canvas.height !== height * dpr) {
            canvas.width = width * dpr;
            canvas.height = height * dpr;
          }

          if (ctx) {
            ctx.save();
            ctx.scale(dpr, dpr);

            let sourceImg = null;

            if (framesReady && frameCache.current.length > 0) {
              const index = Math.min(
                frameCache.current.length - 1,
                Math.floor(progress * frameCache.current.length)
              );
              sourceImg = frameCache.current[index];
            } else if (video && videoLoaded && video.duration) {
              const targetTime = progress * (video.duration - 0.05);
              if (Math.abs(video.currentTime - targetTime) > 0.04) {
                video.currentTime = targetTime;
              }
            }

            if (sourceImg) {
              const imgWidth = 'width' in sourceImg ? sourceImg.width : sourceImg.videoWidth;
              const imgHeight = 'height' in sourceImg ? sourceImg.height : sourceImg.videoHeight;

              if (imgWidth && imgHeight) {
                const scale = Math.max(width / imgWidth, height / imgHeight);
                const drawWidth = imgWidth * scale;
                const drawHeight = imgHeight * scale;
                const x = (width - drawWidth) / 2;
                const y = (height - drawHeight) / 2;

                ctx.clearRect(0, 0, width, height);
                ctx.drawImage(sourceImg, x, y, drawWidth, drawHeight);
              }
            }
            ctx.restore();
          }

          animFrameId.current = requestAnimationFrame(render);
        };

        animFrameId.current = requestAnimationFrame(render);

        return () => {
          if (animFrameId.current) cancelAnimationFrame(animFrameId.current);
        };
      }, [framesReady, videoLoaded]);

      return (
        <div className="fixed inset-0 z-0 bg-[#0a0a0a] overflow-hidden pointer-events-none">
          {/* Poster Image Layer */}
          <img
            src={POSTER_URL}
            alt="Hero Background Poster"
            className={`absolute inset-0 w-full h-full object-cover transition-opacity duration-500 ${
              videoLoaded || framesReady ? 'opacity-0' : 'opacity-100'
            }`}
          />

          {/* Direct Video Fallback Layer */}
          <video
            ref={videoRef}
            src={VIDEO_URL}
            muted
            playsInline
            preload="auto"
            className={`absolute inset-0 w-full h-full object-cover transition-opacity duration-500 ${
              videoLoaded && !framesReady ? 'opacity-100' : 'opacity-0'
            }`}
          />

          {/* Canvas Layer */}
          <canvas
            ref={canvasRef}
            className={`absolute inset-0 w-full h-full transition-opacity duration-500 ${
              framesReady ? 'opacity-100' : 'opacity-0'
            }`}
          />
        </div>
      );
    };

    // --- NAVBAR ---
    const Navbar = () => {
      const navLinks = [
        { label: 'Projects', sup: '6' },
        { label: 'About' },
        { label: 'Blog' },
        { label: 'Contact' },
      ];

      return (
        <header className="fixed top-0 left-0 right-0 z-50 w-full border-b border-white/15 bg-black/10 backdrop-blur-md">
          <div className="flex items-center justify-between px-5 sm:px-8 md:px-12 py-4">
            <Reveal delay={0}>
              <div className="flex items-center gap-2.5 text-white">
                <HexagonIcon size={24} strokeWidth={1.5} className="text-white" />
                <span className="text-lg sm:text-xl font-medium tracking-tight">novaai</span>
              </div>
            </Reveal>

            <nav className="hidden md:flex items-center gap-8 lg:gap-10">
              {navLinks.map((link, idx) => (
                <Reveal key={link.label} delay={100 + idx * 100}>
                  <a
                    href={`#${link.label.toLowerCase()}`}
                    className="text-sm text-white/85 hover:text-white transition-colors duration-300 flex items-start gap-0.5"
                  >
                    <span>{link.label}</span>
                    {link.sup && (
                      <span className="font-mono text-[10px] text-white/60 select-none">
                        {link.sup}
                      </span>
                    )}
                  </a>
                </Reveal>
              ))}
            </nav>

            <Reveal delay={500}>
              <button className="rounded-md border border-white/20 bg-white/15 backdrop-blur-md px-4 py-2 text-xs sm:px-5 sm:text-sm text-white hover:bg-white/25 transition-colors duration-300">
                Get Free Consultation
              </button>
            </Reveal>
          </div>
        </header>
      );
    };

    // --- SECTION ONE (HERO) ---
    const SectionOne = () => {
      const services = [
        "/ AI AUTOMATION",
        "/ AI INTEGRATION",
        "/ AI AGENT DEVELOPMENT"
      ];

      return (
        <section className="relative min-h-screen supports-[height:100svh]:min-h-[100svh] flex flex-col justify-between px-5 sm:px-8 md:px-12 pt-24 sm:pt-28 pb-12 md:pb-16">
          <div className="flex flex-col gap-8 sm:flex-row sm:items-start justify-between">
            <div className="flex flex-col gap-2">
              {services.map((service, idx) => (
                <Reveal key={service} delay={150 + idx * 120}>
                  <span className="font-mono text-xs uppercase tracking-[0.15em] text-white/90 drop-shadow-md block">
                    {service}
                  </span>
                </Reveal>
              ))}
            </div>

            <Reveal delay={300} className="max-w-xs sm:text-right">
              <p className="text-lg sm:text-xl leading-relaxed text-white drop-shadow-md">
                We design automation that brings clarity, precision, and efficiency to the way your company operates.
              </p>
            </Reveal>
          </div>

          <div className="flex flex-col gap-8 md:flex-row md:items-end justify-between mt-12 md:mt-0">
            <div className="flex flex-col items-start">
              <Reveal delay={150}>
                <div className="border-l-2 border-white bg-white/15 px-3 py-1.5 backdrop-blur-md mb-5">
                  <span className="font-mono text-[11px] uppercase tracking-[0.15em] text-white">
                    We Automate 100+ Businesses
                  </span>
                </div>
              </Reveal>

              <Reveal delay={280}>
                <h1 className="text-5xl sm:text-6xl lg:text-7xl font-normal leading-[1.05] tracking-tight text-white drop-shadow-lg">
                  Clear. Precise.<br />
                  Automated.
                </h1>
              </Reveal>
            </div>

            <Reveal delay={420}>
              <div className="flex items-center gap-4 rounded-xl bg-white/15 p-3 backdrop-blur-md border border-white/15">
                <img
                  src={PORTRAIT_URL}
                  alt="Mitha, co-founder of NovaAI"
                  className="h-24 w-20 rounded-lg object-cover"
                />
                <div className="flex flex-col gap-1.5 pr-2">
                  <span className="text-sm font-medium text-white">Talk with Mitha</span>
                  <span className="font-mono text-[10px] uppercase tracking-[0.15em] text-white/60">
                    Co-founder of NovaAI
                  </span>
                  <button className="mt-1.5 inline-flex items-center gap-1 rounded-full bg-white px-4 py-2 text-xs font-medium text-black hover:bg-white/85 transition-colors duration-300 w-fit">
                    <span>Book 15-mins call</span>
                    <ChevronRightIcon size={14} />
                  </button>
                </div>
              </div>
            </Reveal>
          </div>
        </section>
      );
    };

    // --- SECTION TWO (CAPABILITY) ---
    const SectionTwo = () => {
      const capabilities = [
        {
          num: "01",
          title: "Real-time vision",
          body: "Reads context as it happens and surfaces what matters before you ask."
        },
        {
          num: "02",
          title: "Layered insight",
          body: "Moves from rough outline to sharp output without losing the thread."
        },
        {
          num: "03",
          title: "Adaptive speed",
          body: "Learns your cadence and tightens every pass as you work."
        }
      ];

      return (
        <section className="relative min-h-screen supports-[height:100svh]:min-h-[100svh] flex flex-col justify-between px-5 sm:px-8 md:px-12 pt-24 sm:pt-28 pb-12 md:pb-16">
          <div className="flex flex-col gap-8 sm:flex-row sm:items-start justify-between">
            <Reveal delay={120}>
              <div className="border-l-2 border-white bg-white/15 px-3 py-1.5 backdrop-blur-md w-fit">
                <span className="font-mono text-[11px] uppercase tracking-[0.15em] text-white">
                  Insight On Demand
                </span>
              </div>
            </Reveal>

            <Reveal delay={220} className="max-w-sm sm:text-right">
              <p className="text-lg sm:text-xl leading-relaxed text-white drop-shadow-md">
                Our AI doesn't just respond — it interprets, sharpens, and delivers the signal you need.
              </p>
            </Reveal>
          </div>

          <div className="flex-1 flex flex-col justify-end gap-12 md:flex-row md:items-end md:justify-between md:gap-16 mt-12 md:mt-0">
            <div className="max-w-xl">
              <Reveal delay={180}>
                <h2 className="text-5xl sm:text-6xl lg:text-7xl font-normal leading-[1.05] tracking-tight text-white drop-shadow-lg">
                  Learn to see<br />
                  brilliantly.
                </h2>
              </Reveal>

              <Reveal delay={320}>
                <p className="mt-6 max-w-md text-sm sm:text-base text-white/80 drop-shadow-md leading-relaxed">
                  From the first sketch to the final render, Nova turns raw intent into decisions your team can act on — quietly, precisely, at speed.
                </p>
              </Reveal>

              <Reveal delay={420}>
                <div className="mt-8 flex flex-wrap gap-3">
                  <button className="inline-flex items-center gap-1.5 rounded-full bg-white px-5 py-2.5 text-xs sm:text-sm font-medium text-black hover:bg-white/85 transition-colors duration-300">
                    <span>Run the demo</span>
                    <ChevronRightIcon size={14} />
                  </button>
                  <button className="rounded-full border border-white/25 bg-white/10 backdrop-blur-md px-5 py-2.5 text-xs sm:text-sm text-white hover:bg-white/20 transition-colors duration-300">
                    Free consultation
                  </button>
                </div>
              </Reveal>
            </div>

            <div className="w-full max-w-md rounded-2xl border border-white/15 bg-white/10 backdrop-blur-md px-5 sm:px-6">
              {capabilities.map((item, idx) => (
                <Reveal key={item.num} delay={300 + idx * 110}>
                  <div
                    className={`flex gap-5 py-5 ${
                      idx !== capabilities.length - 1 ? 'border-b border-white/15' : ''
                    }`}
                  >
                    <span className="font-mono text-[11px] tracking-[0.15em] text-white/55 pt-1">
                      {item.num}
                    </span>
                    <div className="flex-1">
                      <div className="group flex items-center justify-between cursor-pointer">
                        <h3 className="text-base sm:text-lg font-medium text-white">
                          {item.title}
                        </h3>
                        <ChevronRightIcon
                          size={16}
                          className="text-white/40 transition-all duration-300 group-hover:translate-x-0.5 group-hover:text-white"
                        />
                      </div>
                      <p className="mt-1.5 text-sm leading-relaxed text-white/70">
                        {item.body}
                      </p>
                    </div>
                  </div>
                </Reveal>
              ))}
            </div>
          </div>
        </section>
      );
    };

    // --- MAIN APP ---
    const App = () => {
      return (
        <div className="relative min-h-screen bg-[#0a0a0a] font-sans text-white antialiased selection:bg-white/20">
          <ScrollVideo />
          <div className="relative z-10">
            <Navbar />
            <main>
              <SectionOne />
              <div className="h-[80vh]" aria-hidden="true" />
              <SectionTwo />
            </main>
          </div>
        </div>
      );
    };

    // Render to DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
